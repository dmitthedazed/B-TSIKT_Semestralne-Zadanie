spring.datasource.url=jdbc:h2:mem:demo;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false

# Basic security defaults (reuse JWT, but against demo data)
jwt.secret=ZGVtb19zZWNyZXRfa2V5X2RlbW9fc2VjcmV0X2tleV9kZW1v
jwt.expiration=86400000

# Run demo on a separate port so it can coexist with the default profile
server.port=8081
